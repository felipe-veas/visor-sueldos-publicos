name: Python Application

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install uv
        uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7.6.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install dependencies from lockfile
        run: |
          # Use uv to sync the environment exactly as defined in uv.lock
          uv sync --frozen --all-extras

      - name: Compile python files
        run: |
          uv run python -m py_compile app.py src/core/config.py src/core/queries.py src/ui/views.py src/etl/ingest.py src/etl/sync.py

      - name: Lint with ruff
        run: |
          # Ruff is significantly faster and more comprehensive than flake8
          uv run ruff check .
          uv run ruff format --check . || true

      - name: Test with pytest
        run: |
          # Run unit tests
          uv run pytest tests/
